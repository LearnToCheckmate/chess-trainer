<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Chess Trainer</title>
  <meta name="description" content="Learn openings, solve puzzles, review your games move-by-move, and play vs the computer." />
  <meta name="theme-color" content="#0e1626" />

  <!-- PWA / installable -->
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icon-192.png" />
  <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Chess Trainer" />
  <meta name="mobile-web-app-capable" content="yes" />

  <style>
    /* Lock the page itself: no whole-screen scroll, no rubber-band bounce. */
    html, body {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
      background: #0e1626;
    }
    body {
      position: fixed; inset: 0;
      -webkit-text-size-adjust: 100%;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    /* The app scrolls inside here if its content ever overflows — the page never does. */
    #root {
      height: 100%;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }
    #boot {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
      color: #8fc4ec; background: #0e1626;
      font: 15px/1.5 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      letter-spacing: .5px;
    }
  </style>

  <!-- Cloud bridge: defined before app.js so the app can always call it. -->
  <script>
    window.CTCloud = {
      ready:false, user:null, _cbs:[],
      onAuth:function(cb){ this._cbs.push(cb); if(this.ready){ try{cb(this.user);}catch(e){} } },
      _emit:function(u){ this.user=u; this.ready=true; this._cbs.forEach(function(cb){ try{cb(u);}catch(e){} }); },
      signIn:function(){ return this._signIn ? this._signIn() : Promise.reject(new Error('cloud-not-ready')); },
      signOut:function(){ return this._signOut ? this._signOut() : Promise.resolve(); },
      load:function(){ return this._load ? this._load() : Promise.resolve(null); },
      save:function(d){ return this._save ? this._save(d) : Promise.resolve(); },
      gameCreate:function(c){ return this._gameCreate ? this._gameCreate(c) : Promise.reject(new Error('cloud-not-ready')); },
      gameJoin:function(c){ return this._gameJoin ? this._gameJoin(c) : Promise.reject(new Error('cloud-not-ready')); },
      gameWatch:function(id,cb){ return this._gameWatch ? this._gameWatch(id,cb) : function(){}; },
      gamePush:function(id,d){ return this._gamePush ? this._gamePush(id,d) : Promise.resolve(); },
      gameChat:function(id,m){ return this._gameChat ? this._gameChat(id,m) : Promise.resolve(); },
      gameLeave:function(){ return this._gameLeave ? this._gameLeave() : undefined; }
    };
  </script>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup, signInWithRedirect, getRedirectResult, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { getFirestore, doc, getDoc, setDoc, updateDoc, onSnapshot, arrayUnion } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
    const cfg = {
      apiKey:"AIzaSyA_Z2O3L7I1QAHZmTdCwpUUpIG2z5Ck_QM",
      authDomain:"chess-trainer-d3664.firebaseapp.com",
      projectId:"chess-trainer-d3664",
      storageBucket:"chess-trainer-d3664.firebasestorage.app",
      messagingSenderId:"981387559895",
      appId:"1:981387559895:web:dcfed8c769b5cd5a984192",
      measurementId:"G-5R3HLNCTBQ"
    };
    const C = window.CTCloud;
    try {
      const app = initializeApp(cfg);
      const auth = getAuth(app);
      const db = getFirestore(app);
      const provider = new GoogleAuthProvider();
      provider.setCustomParameters({ prompt: 'select_account' });
      const standalone = (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone === true;
      getRedirectResult(auth).catch(function(){});
      C._signIn  = function(){
        if (standalone) { return signInWithRedirect(auth, provider); }
        return signInWithPopup(auth, provider).catch(function(err){
          var c = err && err.code;
          if (c==='auth/popup-blocked' || c==='auth/operation-not-supported-in-this-environment' || c==='auth/cancelled-popup-request' || c==='auth/popup-closed-by-user') {
            return signInWithRedirect(auth, provider);
          }
          throw err;
        });
      };
      C._signOut = function(){ return signOut(auth); };
      C._load    = async function(){ const u=auth.currentUser; if(!u) return null; const snap=await getDoc(doc(db,'users',u.uid)); return snap.exists()?snap.data():null; };
      C._save    = async function(d){ const u=auth.currentUser; if(!u) return; await setDoc(doc(db,'users',u.uid), Object.assign({}, d, {updatedAt:Date.now()}), {merge:true}); };
      let _gu=null;
      C._gameCreate = async function(color){ const u=auth.currentUser; if(!u) throw new Error('signin');
        const code=Math.random().toString(36).slice(2,7).toUpperCase();
        const me={uid:u.uid,name:u.displayName||'Player',photo:u.photoURL||''};
        const data={code:code,status:'waiting',moves:[],result:null,chat:[],createdAt:Date.now(),updatedAt:Date.now()};
        data[color==='b'?'b':'w']=me;
        await setDoc(doc(db,'games',code), data); return {id:code,code:code}; };
      C._gameJoin = async function(code){ const u=auth.currentUser; if(!u) throw new Error('signin');
        code=String(code||'').trim().toUpperCase(); const ref=doc(db,'games',code); const snap=await getDoc(ref);
        if(!snap.exists()) throw new Error('notfound'); const g=snap.data();
        const me={uid:u.uid,name:u.displayName||'Player',photo:u.photoURL||''};
        if(g.status==='active'){ if(g.w&&g.w.uid===u.uid) return {id:code,color:'w'}; if(g.b&&g.b.uid===u.uid) return {id:code,color:'b'}; }
        const free=g.w?(g.b?null:'b'):'w'; if(!free) throw new Error('full');
        const upd={status:'active',updatedAt:Date.now()}; upd[free]=me; await updateDoc(ref,upd); return {id:code,color:free}; };
      C._gameWatch = function(id,cb){ if(_gu)_gu(); _gu=onSnapshot(doc(db,'games',id), function(s){ cb(s.exists()?s.data():null); }, function(){ cb(null); }); return _gu; };
      C._gamePush  = function(id,d){ return updateDoc(doc(db,'games',id), Object.assign({}, d, {updatedAt:Date.now()})); };
      C._gameChat  = function(id,m){ return updateDoc(doc(db,'games',id), {chat:arrayUnion(m)}); };
      C._gameLeave = function(){ if(_gu){ _gu(); _gu=null; } };
      onAuthStateChanged(auth, function(u){ C._emit(u ? {uid:u.uid, name:u.displayName, email:u.email, photo:u.photoURL} : null); });
    } catch(e) {
      console.error('Firebase init failed', e);
      C._emit(null);
    }
  </script>
</head>
<body>
  <div id="root"><div id="boot">Loading Chess Trainer…</div></div>
  <noscript>This app needs JavaScript enabled.</noscript>

  <script src="./app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('./sw.js').catch(function () {});
      });
    }
  </script>
</body>
</html>
