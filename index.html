   THE SCREEN, NOT THE PAGE. Installed from the Home Screen with a black-translucent status bar, iOS draws the page from the
   top of the screen but reports a layout viewport the status bar's height SHORTER than the screen (375x761 on his 375x812
   phone), so every position:fixed inset:0 layer, #root and the tab bar stopped 51pt above the bottom and the last 51pt were
   never painted - while the tab bar still added the home-indicator inset on top. When the script below sees exactly that
   signature it sizes html and body to the screen height and makes body the containing block of every fixed layer
   (transform), so the bars reach the bottom edge and the inset is counted once. Anywhere else the class is absent and
   nothing here applies. */
html.ct-fullh,html.ct-fullh body{height:var(--ct-full-h)}
html.ct-fullh body{bottom:auto;transform:translateZ(0)}

        try{var o=(localStorage.getItem('ct_safe')||'').split(',').map(Number);if(o.length===2&&o[0]>=0&&o[0]<120)return o[0];}catch(e){}
        try{var p=document.createElement('div');p.style.cssText='position:absolute;left:0;top:0;height:env(safe-area-inset-top,0px);width:1px;visibility:hidden;pointer-events:none';document.documentElement.appendChild(p);var h=p.getBoundingClientRect().height;p.parentNode.removeChild(p);return Math.round(h);}catch(e){return 0;}
      }
      function standalone(){
        try{if(localStorage.getItem('ct_fullh')==='1')return true;}catch(e){} /* dev and gate only: Chromium is never an installed iOS app */
        try{if(navigator.standalone===true)return true;if(window.matchMedia&&window.matchMedia('(display-mode: standalone)').matches)return true;}catch(e){}
        return false;
      }
      function fit(){
        var d=document.documentElement,on=false,full=0;
        try{
          var W=window.innerWidth,H=window.innerHeight,sw=screen.width||0,sh=screen.height||0;
          full=W<H?Math.max(sw,sh):Math.min(sw,sh);
          var gap=full-H,t=topInset();
          /* the exact signature, and nothing looser: an installed app, upright, short by the top inset and by nothing else */
          on=standalone()&&W<H&&gap>0&&gap<120&&Math.abs(gap-t)<=2;
        }catch(e){on=false;}
        if(on){d.style.setProperty('--ct-full-h',full+'px');d.classList.add('ct-fullh');window.__ctFullH=full;}
        else{d.classList.remove('ct-fullh');d.style.removeProperty('--ct-full-h');window.__ctFullH=0;}

        _mmu=onSnapshot(doc(db,'mm',u.uid), function(s){ const e=s.exists()?s.data():null;
          if(e&&e.status==='matched'&&e.gameId){ const gid=e.gameId; if(_mmu){ try{_mmu();}catch(e2){} _mmu=null; } deleteDoc(doc(db,'mm',u.uid)).catch(function(){});
            getDoc(doc(db,'games',gid)).then(function(gs){ const gd=gs.exists()?gs.data():null; let color='b'; if(gd){ if(gd.w&&gd.w.uid===u.uid)color='w'; else if(gd.b&&gd.b.uid===u.uid)color='b'; }
              /* #550 SEC-06: a gameId handed over in the queue is followed only when that game seats this player (rules also check it) */
              if(!gd||!((gd.w&&gd.w.uid===u.uid)||(gd.b&&gd.b.uid===u.uid))) return; try{ setDoc(doc(db,'users',u.uid), {games:arrayUnion(gid), updatedAt:Date.now()}, {merge:true}); }catch(e3){} if(typeof cb==='function') cb({id:gid,color:color}); }).catch(function(){ if(typeof cb==='function') cb({id:gid,color:'b'}); });
          }
        }, function(){});
        return {waiting:true};
      };
      C._gameLeave = function(){ if(_gu){ _gu(); _gu=null; } };
      // ---- Stripe Pro (firestore-stripe-payments extension, default instance "firestore-stripe-payments", region us-central1) ----
      let _psub=null;
      C._proWatch = function(cb){
        const u=auth.currentUser; if(!u){ if(typeof cb==='function') cb(false); return function(){}; }
        if(_psub){ try{_psub();}catch(e){} _psub=null; }
        _psub=onSnapshot(collection(db,'customers',u.uid,'subscriptions'), function(snap){
          let active=false; snap.forEach(function(d){ const s=d.data()||{}; if(s.status==='active'||s.status==='trialing') active=true; });
          if(typeof cb==='function') cb(active);
        }, function(){ if(typeof cb==='function') cb(false); });
        return _psub;
      };
      C._proCheckout = async function(priceId){
        const u=auth.currentUser; if(!u) throw new Error('signin');
        const ref=await addDoc(collection(db,'customers',u.uid,'checkout_sessions'), {
          price: priceId, mode:'subscription',
          success_url: window.location.href, cancel_url: window.location.href,
          allow_promotion_codes:true
        });
        return new Promise(function(resolve,reject){
          let done=false;
          const unsub=onSnapshot(ref, function(snap){
            const d=snap.data()||{};
            if(d.error){ done=true; try{unsub();}catch(e){} reject(new Error(d.error.message||'checkout-failed')); }
            else if(d.url){ done=true; try{unsub();}catch(e){} resolve(); window.location.assign(d.url); }
          }, function(e){ done=true; reject(e); });
          setTimeout(function(){ if(!done){ try{unsub();}catch(e){} reject(new Error('timeout')); } }, 25000);
        });
      };
      C._proPortal = async function(){
        const u=auth.currentUser; if(!u) throw new Error('signin');
        const fns=getFunctions(app);
        const createPortal=httpsCallable(fns,'ext-firestore-stripe-payments-createPortalLink');
        const res=await createPortal({ returnUrl: window.location.href });
        const url=res && res.data && res.data.url;
        if(url) window.location.assign(url); else throw new Error('no-portal-url');
      };
      // ---- Friends (mutual request + accept; add by user ID) ----
      let _frU=null,_frF=null;
      C._friendId=function(){ const u=auth.currentUser; return u?u.uid:null; };
      C._friendRequest=async function(toUid,toName){
        const u=auth.currentUser; if(!u) throw new Error('signin');
        toUid=(toUid||'').trim(); if(!toUid) throw new Error('empty'); if(toUid===u.uid) throw new Error('self');
        const ex=await getDocs(query(collection(db,'friendReqs'),where('from','==',u.uid)));
        let dup=false; ex.forEach(function(d){ const x=d.data()||{}; if(x.to===toUid&&x.status==='pending') dup=true; }); if(dup) throw new Error('pending');
        const fr=await getDocs(query(collection(db,'friends'),where('users','array-contains',u.uid)));
        let already=false; fr.forEach(function(d){ const x=d.data()||{}; if((x.users||[]).indexOf(toUid)>=0) already=true; }); if(already) throw new Error('already');
        await addDoc(collection(db,'friendReqs'),{ from:u.uid, fromName:(u.displayName||'Player'), to:toUid, status:'pending', at:Date.now() });
      };
      C._friendsWatch=function(cb){
        const u=auth.currentUser; if(!u){ if(typeof cb==='function') cb({incoming:[],friends:[]}); return function(){}; }
        let inc=[],fri=[]; const emit=function(){ if(typeof cb==='function') cb({incoming:inc.slice(),friends:fri.slice()}); };
        if(_frU){try{_frU();}catch(e){}} if(_frF){try{_frF();}catch(e){}}
        _frU=onSnapshot(query(collection(db,'friendReqs'),where('to','==',u.uid)),function(sn){ inc=[]; sn.forEach(function(d){ const x=d.data()||{}; if(x.status==='pending') inc.push({id:d.id,from:x.from,fromName:x.fromName||'Player',at:x.at||0}); }); emit(); },function(){});
        _frF=onSnapshot(query(collection(db,'friends'),where('users','array-contains',u.uid)),function(sn){ fri=[]; sn.forEach(function(d){ const x=d.data()||{}; const o=(x.users||[]).filter(function(z){return z!==u.uid;})[0]; fri.push({id:d.id,uid:o,name:(x.names&&x.names[o])||'Friend',at:x.at||0}); }); emit(); },function(){});
        return function(){ if(_frU){try{_frU();}catch(e){}_frU=null;} if(_frF){try{_frF();}catch(e){}_frF=null;} };
      };
      C._friendAccept=async function(req){
        const u=auth.currentUser; if(!u) throw new Error('signin'); if(!req||!req.from) throw new Error('bad');
        const names={}; names[req.from]=req.fromName||'Player'; names[u.uid]=(u.displayName||'Player');
        /* #550 SEC-08: the friendship names the pending request it answers (req), and firestore.rules checks that request exists, was
           sent BY req.from TO this user, and that the sender's name is the one the request carried. */
        await addDoc(collection(db,'friends'),{ users:[req.from,u.uid], names:names, at:Date.now(), req:String(req.id||'') });
        if(req.id){ try{ await deleteDoc(doc(db,'friendReqs',req.id)); }catch(e){} }
      };
      C._friendDecline=async function(reqId){ const u=auth.currentUser; if(!u) throw new Error('signin'); await deleteDoc(doc(db,'friendReqs',reqId)); };
      C._friendRemove=async function(fid){ const u=auth.currentUser; if(!u) throw new Error('signin'); await deleteDoc(doc(db,'friends',fid)); };
      // ---- Photo to board (calls a deployed Cloud Function 'scanBoard' that returns a FEN) ----
      C._scanBoard=async function(imgB64){ const fns=getFunctions(app); const call=httpsCallable(fns,'scanBoard'); const r=await call({ image:imgB64 }); return (r&&r.data)||null; };
      // ---- Play nearby (opt-in, coarse location) ----
      C._nearbyJoin=async function(geo,name){ const u=auth.currentUser; if(!u) throw new Error('signin'); await setDoc(doc(db,'nearby',u.uid),{ uid:u.uid, name:(name||u.displayName||'Player'), geo:geo, at:Date.now() }); };
      C._nearbyLeave=async function(){ const u=auth.currentUser; if(!u) return; try{ await deleteDoc(doc(db,'nearby',u.uid)); }catch(e){} };
      C._nearbyList=function(geo,cb){ try{ const qy=query(collection(db,'nearby'), where('geo','==',geo)); return onSnapshot(qy, function(snap){ const out=[]; snap.forEach(function(d){ out.push(d.data()); }); cb(out); }, function(e){ cb([]); }); }catch(e){ cb([]); return function(){}; } };
      /* #550 SEC-13: DELETE ACCOUNT. Google confirms it is this player FIRST, so a closed confirmation deletes nothing. Then every document
         keyed to the uid is removed or scrubbed, and only when all of that succeeded is the Firebase Auth account deleted (a partial
         failure throws, the account stays, and tapping again finishes the job - every step is safe to repeat). Not removable from the
         browser and left to the Stripe payments extension: customers/{uid}, its subscriptions and payments, and the Stripe customer. */
      C._deleteAccount = async function(){
        const u=auth.currentUser; if(!u) throw new Error('signin'); const uid=u.uid;
        try{ await reauthenticateWithPopup(u, provider); }
        catch(e){ const c=e&&e.code; if(c==='auth/popup-closed-by-user'||c==='auth/cancelled-popup-request'||c==='auth/user-mismatch') throw e; /* popup blocked or unsupported: deleteUser below says if a fresh sign-in is needed */ }
        const fails=[]; const step=async function(label,fn){ try{ await fn(); }catch(e){ fails.push(label+': '+((e&&e.code)||(e&&e.message)||e)); } };
        let codes=[]; await step('users read', async function(){ const s=await getDoc(doc(db,'users',uid)); const d=s.exists()?s.data():null; codes=(d&&Array.isArray(d.games))?d.games.slice():[]; });
        for(let i=0;i<codes.length;i++){ const code=String(codes[i]); await step('game '+code, async function(){
          const ref=doc(db,'games',code); let s; try{ s=await getDoc(ref); }catch(e){ if(e&&e.code==='permission-denied') return; throw e; } if(!s.exists()) return;
          const g=s.data()||{}; const seat=(g.w&&g.w.uid===uid)?'w':((g.b&&g.b.uid===uid)?'b':null); if(!seat) return;
          try{ await deleteDoc(doc(db,'games',code,'call','signal')); }catch(e){}
          if(g.status==='waiting'){ await deleteDoc(ref); return; }
          const upd={updatedAt:Date.now()}; upd[seat]={uid:uid,name:'Deleted player',photo:''};
          upd.chat=(Array.isArray(g.chat)?g.chat:[]).filter(function(m){ return !(m&&m.uid===uid); }); await updateDoc(ref, upd); }); }
        await step('mm', function(){ return deleteDoc(doc(db,'mm',uid)); });
        await step('nearby', function(){ return deleteDoc(doc(db,'nearby',uid)); });
        const delAll=async function(qy){ const sn=await getDocs(qy); const ps=[]; sn.forEach(function(d){ ps.push(deleteDoc(d.ref)); }); await Promise.all(ps); };
        await step('friendReqs from', function(){ return delAll(query(collection(db,'friendReqs'),where('from','==',uid))); });
        await step('friendReqs to', function(){ return delAll(query(collection(db,'friendReqs'),where('to','==',uid))); });
        await step('friends', function(){ return delAll(query(collection(db,'friends'),where('users','array-contains',uid))); });
        await step('tournaments', async function(){ const sn=await getDocs(collection(db,'tournaments')); const ps=[];
          sn.forEach(function(d){ const t=d.data()||{}; if(t.host===uid){ ps.push(deleteDoc(d.ref)); return; }
            const mine=(Array.isArray(t.players)?t.players:[]).filter(function(p){ return p&&p.uid===uid; });
            mine.forEach(function(p){ ps.push(updateDoc(d.ref,{players:arrayRemove(p), updatedAt:Date.now()})); }); });
          await Promise.all(ps); });
        await step('checkout_sessions', function(){ return delAll(collection(db,'customers',uid,'checkout_sessions')); });
        if(!fails.length) await step('users', function(){ return deleteDoc(doc(db,'users',uid)); });
        if(fails.length){ const e=new Error('partial ('+fails.slice(0,3).join('; ')+')'); e.code='partial'; e.fails=fails; throw e; }
        try{ await deleteUser(u); }catch(e){ if(e&&e.code==='auth/requires-recent-login'){ const e2=new Error('reauth'); e2.code='auth/requires-recent-login'; throw e2; } throw e; }
        return {ok:true};
      };
      onAuthStateChanged(auth, function(u){ C._emit(u ? {uid:u.uid, name:u.displayName, email:u.email, photo:u.photoURL} : null); });
    } catch(e) {
      console.error('Firebase init failed', e);
      C._emit(null);
    }
  </script>
