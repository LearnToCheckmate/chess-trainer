  <script>
    window.CTCloud = {
      ready:false, user:null, _cbs:[],
      onAuth:function(cb){ this._cbs.push(cb); if(this.ready){ try{cb(this.user);}catch(e){} } },
      _emit:function(u){ this.user=u; this.ready=true; this._cbs.forEach(function(cb){ try{cb(u);}catch(e){} }); },
      signIn:function(){ return this._signIn ? this._signIn() : Promise.reject(new Error('cloud-not-ready')); },
      signOut:function(){ return this._signOut ? this._signOut() : Promise.resolve(); },

      gameCreate:function(c){ return this._gameCreate ? this._gameCreate(c) : Promise.reject(new Error('cloud-not-ready')); },
      gameJoin:function(c){ return this._gameJoin ? this._gameJoin(c) : Promise.reject(new Error('cloud-not-ready')); },
      gameWatch:function(id,cb){ return this._gameWatch ? this._gameWatch(id,cb) : function(){}; },
      gamePush:function(id,d){ return this._gamePush ? this._gamePush(id,d) : Promise.resolve(); },
      gameChat:function(id,m){ return this._gameChat ? this._gameChat(id,m) : Promise.resolve(); },
      gameLeave:function(){ return this._gameLeave ? this._gameLeave() : undefined; },
      gameList:function(){ return this._gameList ? this._gameList() : Promise.resolve([]); },
      mmFind:function(tc,cb){ return this._mmFind ? this._mmFind(tc,cb) : Promise.reject(new Error('cloud-not-ready')); },
      mmCancel:function(){ return this._mmCancel ? this._mmCancel() : undefined; },
      proWatch:function(cb){ return this._proWatch ? this._proWatch(cb) : (typeof cb==='function' && cb(false), function(){}); },
      proCheckout:function(p){ return this._proCheckout ? this._proCheckout(p) : Promise.reject(new Error('cloud-not-ready')); },
      proPortal:function(){ return this._proPortal ? this._proPortal() : Promise.reject(new Error('cloud-not-ready')); },
      friendId:function(){ return this._friendId ? this._friendId() : null; },
      friendRequest:function(t,n){ return this._friendRequest ? this._friendRequest(t,n) : Promise.reject(new Error('cloud-not-ready')); },
      friendsWatch:function(cb){ return this._friendsWatch ? this._friendsWatch(cb) : ((typeof cb==='function')&&cb({incoming:[],friends:[]}), function(){}); },
      friendAccept:function(r){ return this._friendAccept ? this._friendAccept(r) : Promise.reject(new Error('cloud-not-ready')); },
      friendDecline:function(id){ return this._friendDecline ? this._friendDecline(id) : Promise.reject(new Error('cloud-not-ready')); },
      friendRemove:function(id){ return this._friendRemove ? this._friendRemove(id) : Promise.reject(new Error('cloud-not-ready')); },
      scanBoard:function(img){ return this._scanBoard ? this._scanBoard(img) : Promise.reject(new Error('cloud-not-ready')); },
      nearbyJoin:function(geo,name){ return this._nearbyJoin ? this._nearbyJoin(geo,name) : Promise.reject(new Error('cloud-not-ready')); },
      nearbyLeave:function(){ return this._nearbyLeave ? this._nearbyLeave() : Promise.resolve(); },
      nearbyList:function(geo,cb){ return this._nearbyList ? this._nearbyList(geo,cb) : function(){}; },
      tourCreate:function(d){ return this._tourCreate ? this._tourCreate(d) : Promise.reject(new Error('cloud-not-ready')); },
      tourList:function(cb){ return this._tourList ? this._tourList(cb) : function(){}; },
      tourWatch:function(id,cb){ return this._tourWatch ? this._tourWatch(id,cb) : function(){}; },
      tourJoin:function(id,p){ return this._tourJoin ? this._tourJoin(id,p) : Promise.reject(new Error('cloud-not-ready')); },

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup, signInWithRedirect, getRedirectResult, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { getFirestore, doc, getDoc, setDoc, updateDoc, onSnapshot, arrayUnion, collection, addDoc, getDocs, deleteDoc, runTransaction, query, where } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
    import { getFunctions, httpsCallable } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-functions.js";
    const cfg = {
      apiKey:"AIzaSyA_Z2O3L7I1QAHZmTdCwpUUpIG2z5Ck_QM",
      authDomain:"chess-trainer-d3664.firebaseapp.com",
      projectId:"chess-trainer-d3664",
      storageBucket:"chess-trainer-d3664.firebasestorage.app",
      messagingSenderId:"981387559895",
      appId:"1:981387559895:web:dcfed8c769b5cd5a984192",
      measurementId:"G-5R3HLNCTBQ"
    };
    const C = window.CTCloud;
    try {
      const app = initializeApp(cfg);
      const auth = getAuth(app);
      const db = getFirestore(app);
      // Pre-warm the Firestore connection on load so the first real read/write (often the first online move) is not slow.
      try{ getDoc(doc(db,'_warm','ping')).catch(function(){}); }catch(e){}
      const provider = new GoogleAuthProvider();
      provider.setCustomParameters({ prompt: 'select_account' });
      const standalone = (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone === true;
      getRedirectResult(auth).catch(function(){});
      C._signIn  = function(){
        if (standalone) { return signInWithRedirect(auth, provider); }
        return signInWithPopup(auth, provider).catch(function(err){
          var c = err && err.code;
          if (c==='auth/popup-blocked' || c==='auth/operation-not-supported-in-this-environment' || c==='auth/cancelled-popup-request' || c==='auth/popup-closed-by-user') {
            return signInWithRedirect(auth, provider);
          }
          throw err;
        });
      };
      C._signOut = function(){ return signOut(auth); };
      C._load    = async function(){ const u=auth.currentUser; if(!u) return null; const snap=await getDoc(doc(db,'users',u.uid)); return snap.exists()?snap.data():null; };
      C._save    = async function(d){ const u=auth.currentUser; if(!u) return; await setDoc(doc(db,'users',u.uid), Object.assign({}, d, {updatedAt:Date.now()}), {merge:true}); };
      let _gu=null;
      C._gameCreate = async function(color, tc){ const u=auth.currentUser; if(!u) throw new Error('signin');
        const code=Math.random().toString(36).slice(2,7).toUpperCase();
        const me={uid:u.uid,name:u.displayName||'Player',photo:u.photoURL||''};
        const now=Date.now();
        const _live = tc && tc.kind!=='corr' && tc.init; const data={code:code,status:'waiting',moves:[],result:null,chat:[],tc:tc||null,clk:_live?{w:tc.init*1000,b:tc.init*1000}:null,createdAt:now,updatedAt:now,moveAt:now};
        data[color==='b'?'b':'w']=me;
        await setDoc(doc(db,'games',code), data);
        try{ await setDoc(doc(db,'users',u.uid), {games:arrayUnion(code), updatedAt:now}, {merge:true}); }catch(e){}
        return {id:code,code:code}; };
      C._gameJoin = async function(code){ const u=auth.currentUser; if(!u) throw new Error('signin');
        code=String(code||'').trim().toUpperCase(); const ref=doc(db,'games',code); const snap=await getDoc(ref);
        if(!snap.exists()) throw new Error('notfound'); const g=snap.data();
        const me={uid:u.uid,name:u.displayName||'Player',photo:u.photoURL||''};
        const remember=async function(){ try{ await setDoc(doc(db,'users',u.uid), {games:arrayUnion(code), updatedAt:Date.now()}, {merge:true}); }catch(e){} };
        if(g.w&&g.w.uid===u.uid){ await remember(); return {id:code,color:'w'}; }
        if(g.b&&g.b.uid===u.uid){ await remember(); return {id:code,color:'b'}; }
        const free=g.w?(g.b?null:'b'):'w'; if(!free) throw new Error('full');
        const upd={status:'active',updatedAt:Date.now()}; upd[free]=me; await updateDoc(ref,upd);
        await remember(); return {id:code,color:free}; };
      C._gameList = async function(){ const u=auth.currentUser; if(!u) return [];
        let codes=[]; try{ const snap=await getDoc(doc(db,'users',u.uid)); const d=snap.exists()?snap.data():null; codes=(d&&Array.isArray(d.games))?d.games.slice(-40):[]; }catch(e){ return []; }
        const out=[]; for(let i=0;i<codes.length;i++){ try{ const s=await getDoc(doc(db,'games',codes[i])); if(s.exists()){ const g=s.data(); g.id=codes[i]; out.push(g); } }catch(e){} }
        out.sort(function(a,b){ return (b.updatedAt||0)-(a.updatedAt||0); }); return out; };
      C._gameWatch = function(id,cb){ if(_gu)_gu(); _gu=onSnapshot(doc(db,'games',id), function(s){ cb(s.exists()?s.data():null); }, function(){ cb(null); }); return _gu; };
      C._gamePush  = function(id,d){ return updateDoc(doc(db,'games',id), Object.assign({}, d, {updatedAt:Date.now()})); };
      C._gameChat  = function(id,m){ return updateDoc(doc(db,'games',id), {chat:arrayUnion(m)}); };
      // ---- Tournaments (collection "tournaments") ----
      C._tourCreate = async function(d){ const u=auth.currentUser; if(!u) throw new Error('signin');
        const now=Date.now(); const data=Object.assign({}, d, {host:u.uid, createdAt:now, updatedAt:now, status:(d&&d.status)||'upcoming'});
        const ref=await addDoc(collection(db,'tournaments'), data); return ref.id; };
      C._tourList = function(cb){ if(C._tu){try{C._tu();}catch(e){}} C._tu=onSnapshot(collection(db,'tournaments'), function(s){ const arr=[]; s.forEach(function(d){ const v=d.data(); v.id=d.id; arr.push(v); }); arr.sort(function(a,b){ return (a.startAt||0)-(b.startAt||0); }); cb(arr); }, function(){ cb([]); }); return C._tu; };
      C._tourWatch = function(id,cb){ return onSnapshot(doc(db,'tournaments',id), function(s){ if(!s.exists()){ cb(null); return; } var v=s.data(); v.id=id; cb(v); }, function(){ cb(null); }); };
      C._tourJoin = function(id,p){ return updateDoc(doc(db,'tournaments',id), {players:arrayUnion(p), updatedAt:Date.now()}); };
      C._tourUpdate = function(id,patch){ return updateDoc(doc(db,'tournaments',id), Object.assign({}, patch, {updatedAt:Date.now()})); };
      // ---- Quick match (matchmaking queue in collection "mm") ----
      let _mmu=null;
      function _sameTc(a,b){ const k=function(t){ return t?(t.kind==='corr'?('corr'+t.days):(t.label||'live')):'none'; }; return k(a)===k(b); }
      async function _newPairedGame(meU, otherU, tc){
        const code=Math.random().toString(36).slice(2,7).toUpperCase(); const now=Date.now();
        const iAmWhite=Math.random()<0.5; const w=iAmWhite?meU:otherU; const b=iAmWhite?otherU:meU;
        const live=tc&&tc.kind!=='corr'&&tc.init;
        const data={code:code,status:'active',moves:[],result:null,chat:[],tc:tc||null,clk:live?{w:tc.init*1000,b:tc.init*1000}:null,createdAt:now,updatedAt:now,moveAt:now,w:w,b:b};
        await setDoc(doc(db,'games',code), data);
        try{ await setDoc(doc(db,'users',meU.uid), {games:arrayUnion(code), updatedAt:now}, {merge:true}); }catch(e){}
        return {code:code, color:iAmWhite?'w':'b'};
      }
      C._mmCancel = function(){ const u=auth.currentUser; if(_mmu){ try{_mmu();}catch(e){} _mmu=null; } if(u){ deleteDoc(doc(db,'mm',u.uid)).catch(function(){}); } };
      C._mmFind = async function(tc, cb){
        const u=auth.currentUser; if(!u) throw new Error('signin');
        const me={uid:u.uid,name:u.displayName||'Player',photo:u.photoURL||''};
        let snap; try{ snap=await getDocs(collection(db,'mm')); }catch(e){ throw new Error('mm-read'); }
        let cand=null; snap.forEach(function(d){ const e=d.data()||{}; if(!cand && e.uid && e.uid!==u.uid && e.status==='waiting' && _sameTc(e.tc, tc||null)) cand=e; });
        if(cand){
          const g=await _newPairedGame(me, {uid:cand.uid,name:cand.name||'Player',photo:cand.photo||''}, tc||null);
          let claimed=false;
          try{ await runTransaction(db, async function(tx){ const ref=doc(db,'mm',cand.uid); const cur=await tx.get(ref); if(!cur.exists()||(cur.data()||{}).status!=='waiting') throw new Error('taken'); tx.update(ref,{status:'matched',gameId:g.code,matchedAt:Date.now()}); }); claimed=true; }catch(e){ claimed=false; }
          if(claimed){ try{ await deleteDoc(doc(db,'mm',u.uid)); }catch(e){} if(typeof cb==='function') cb({id:g.code,color:g.color}); return {id:g.code,color:g.color}; }
          try{ await deleteDoc(doc(db,'games',g.code)); }catch(e){}
        }
        await setDoc(doc(db,'mm',u.uid), {uid:u.uid,name:me.name,photo:me.photo,tc:tc||null,status:'waiting',t:Date.now()});
        if(_mmu){ try{_mmu();}catch(e){} _mmu=null; }
        _mmu=onSnapshot(doc(db,'mm',u.uid), function(s){ const e=s.exists()?s.data():null;
          if(e&&e.status==='matched'&&e.gameId){ const gid=e.gameId; if(_mmu){ try{_mmu();}catch(e2){} _mmu=null; } deleteDoc(doc(db,'mm',u.uid)).catch(function(){});
            getDoc(doc(db,'games',gid)).then(function(gs){ const gd=gs.exists()?gs.data():null; let color='b'; if(gd){ if(gd.w&&gd.w.uid===u.uid)color='w'; else if(gd.b&&gd.b.uid===u.uid)color='b'; } try{ setDoc(doc(db,'users',u.uid), {games:arrayUnion(gid), updatedAt:Date.now()}, {merge:true}); }catch(e3){} if(typeof cb==='function') cb({id:gid,color:color}); }).catch(function(){ if(typeof cb==='function') cb({id:gid,color:'b'}); });
          }
        }, function(){});
        return {waiting:true};
      };
      C._gameLeave = function(){ if(_gu){ _gu(); _gu=null; } };
      // ---- Stripe Pro (firestore-stripe-payments extension, default instance "firestore-stripe-payments", region us-central1) ----
      let _psub=null;
      C._proWatch = function(cb){
        const u=auth.currentUser; if(!u){ if(typeof cb==='function') cb(false); return function(){}; }
        if(_psub){ try{_psub();}catch(e){} _psub=null; }
        _psub=onSnapshot(collection(db,'customers',u.uid,'subscriptions'), function(snap){
          let active=false; snap.forEach(function(d){ const s=d.data()||{}; if(s.status==='active'||s.status==='trialing') active=true; });
          if(typeof cb==='function') cb(active);
        }, function(){ if(typeof cb==='function') cb(false); });
        return _psub;
      };
      C._proCheckout = async function(priceId){
        const u=auth.currentUser; if(!u) throw new Error('signin');
        const ref=await addDoc(collection(db,'customers',u.uid,'checkout_sessions'), {
          price: priceId, mode:'subscription',
          success_url: window.location.href, cancel_url: window.location.href,
          allow_promotion_codes:true
        });
        return new Promise(function(resolve,reject){
          let done=false;
          const unsub=onSnapshot(ref, function(snap){
            const d=snap.data()||{};
            if(d.error){ done=true; try{unsub();}catch(e){} reject(new Error(d.error.message||'checkout-failed')); }
            else if(d.url){ done=true; try{unsub();}catch(e){} resolve(); window.location.assign(d.url); }
          }, function(e){ done=true; reject(e); });
          setTimeout(function(){ if(!done){ try{unsub();}catch(e){} reject(new Error('timeout')); } }, 25000);
        });
      };
      C._proPortal = async function(){
        const u=auth.currentUser; if(!u) throw new Error('signin');
        const fns=getFunctions(app);
        const createPortal=httpsCallable(fns,'ext-firestore-stripe-payments-createPortalLink');
        const res=await createPortal({ returnUrl: window.location.href });
        const url=res && res.data && res.data.url;
        if(url) window.location.assign(url); else throw new Error('no-portal-url');
      };
      // ---- Friends (mutual request + accept; add by user ID) ----
      let _frU=null,_frF=null;
      C._friendId=function(){ const u=auth.currentUser; return u?u.uid:null; };
      C._friendRequest=async function(toUid,toName){
        const u=auth.currentUser; if(!u) throw new Error('signin');
        toUid=(toUid||'').trim(); if(!toUid) throw new Error('empty'); if(toUid===u.uid) throw new Error('self');
        const ex=await getDocs(query(collection(db,'friendReqs'),where('from','==',u.uid)));
        let dup=false; ex.forEach(function(d){ const x=d.data()||{}; if(x.to===toUid&&x.status==='pending') dup=true; }); if(dup) throw new Error('pending');
        const fr=await getDocs(query(collection(db,'friends'),where('users','array-contains',u.uid)));
        let already=false; fr.forEach(function(d){ const x=d.data()||{}; if((x.users||[]).indexOf(toUid)>=0) already=true; }); if(already) throw new Error('already');
        await addDoc(collection(db,'friendReqs'),{ from:u.uid, fromName:(u.displayName||'Player'), to:toUid, status:'pending', at:Date.now() });
      };
      C._friendsWatch=function(cb){
        const u=auth.currentUser; if(!u){ if(typeof cb==='function') cb({incoming:[],friends:[]}); return function(){}; }
        let inc=[],fri=[]; const emit=function(){ if(typeof cb==='function') cb({incoming:inc.slice(),friends:fri.slice()}); };
        if(_frU){try{_frU();}catch(e){}} if(_frF){try{_frF();}catch(e){}}
        _frU=onSnapshot(query(collection(db,'friendReqs'),where('to','==',u.uid)),function(sn){ inc=[]; sn.forEach(function(d){ const x=d.data()||{}; if(x.status==='pending') inc.push({id:d.id,from:x.from,fromName:x.fromName||'Player',at:x.at||0}); }); emit(); },function(){});
        _frF=onSnapshot(query(collection(db,'friends'),where('users','array-contains',u.uid)),function(sn){ fri=[]; sn.forEach(function(d){ const x=d.data()||{}; const o=(x.users||[]).filter(function(z){return z!==u.uid;})[0]; fri.push({id:d.id,uid:o,name:(x.names&&x.names[o])||'Friend',at:x.at||0}); }); emit(); },function(){});
        return function(){ if(_frU){try{_frU();}catch(e){}_frU=null;} if(_frF){try{_frF();}catch(e){}_frF=null;} };
      };
      C._friendAccept=async function(req){
        const u=auth.currentUser; if(!u) throw new Error('signin'); if(!req||!req.from) throw new Error('bad');
        const names={}; names[req.from]=req.fromName||'Player'; names[u.uid]=(u.displayName||'Player');
        await addDoc(collection(db,'friends'),{ users:[req.from,u.uid], names:names, at:Date.now() });
        if(req.id){ try{ await deleteDoc(doc(db,'friendReqs',req.id)); }catch(e){} }
      };
      C._friendDecline=async function(reqId){ const u=auth.currentUser; if(!u) throw new Error('signin'); await deleteDoc(doc(db,'friendReqs',reqId)); };
      C._friendRemove=async function(fid){ const u=auth.currentUser; if(!u) throw new Error('signin'); await deleteDoc(doc(db,'friends',fid)); };
      // ---- Photo to board (calls a deployed Cloud Function 'scanBoard' that returns a FEN) ----
      C._scanBoard=async function(imgB64){ const fns=getFunctions(app); const call=httpsCallable(fns,'scanBoard'); const r=await call({ image:imgB64 }); return (r&&r.data)||null; };
      // ---- Play nearby (opt-in, coarse location) ----
      C._nearbyJoin=async function(geo,name){ const u=auth.currentUser; if(!u) throw new Error('signin'); await setDoc(doc(db,'nearby',u.uid),{ uid:u.uid, name:(name||u.displayName||'Player'), geo:geo, at:Date.now() }); };
      C._nearbyLeave=async function(){ const u=auth.currentUser; if(!u) return; try{ await deleteDoc(doc(db,'nearby',u.uid)); }catch(e){} };
      C._nearbyList=function(geo,cb){ try{ const qy=query(collection(db,'nearby'), where('geo','==',geo)); return onSnapshot(qy, function(snap){ const out=[]; snap.forEach(function(d){ out.push(d.data()); }); cb(out); }, function(e){ cb([]); }); }catch(e){ cb([]); return function(){}; } };
      onAuthStateChanged(auth, function(u){ C._emit(u ? {uid:u.uid, name:u.displayName, email:u.email, photo:u.photoURL} : null); });
    } catch(e) {
      console.error('Firebase init failed', e);
      C._emit(null);
    }
  </script>
