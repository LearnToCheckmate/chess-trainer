<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  gates/fonts.conf - THE FONT THE SUITE'S PINS WERE CALIBRATED AGAINST, PINNED.
  Added #485. Turn it off for one run with CT_NOFC=1; an explicit FONTCONFIG_FILE always wins.
  gates/lib.js prints which fontconfig is in force in every gate log, so no log hides what it measured.

  WHY THIS FILE EXISTS, measured at #485 on origin/main's OWN bundle (app.js md5 fb10dbef9591):
  SEVEN consecutive build containers (#479-#484 and this one) could not gate ANY tree. gate 12-hint
  read the puzzle board 361 wide at kunal against a pinned 375, and 258 against 259 at se - 22 pass /
  2 fail, pixel-identical in all seven - and #479's full suite ended GATES RED with 115 FAIL across
  ELEVEN sections. No tree could ship, including two band-16 live defects a player hits.

  THE CAUSE IS A FONT SUBSTITUTION. NOT THE BROWSER, AND NOT THE PINS. The app asks for
  `'Segoe UI', system-ui, sans-serif` as an INLINE style on its own root (chess.jsx:5288), plus ~92
  per-element declarations. None of those faces is installed in these images. This image carries 36
  Inter faces, so fontconfig answers the generic chain with Inter. Inter's line boxes run 1-2px taller
  per text block than the calibration face; the puzzle column accumulates about 14px of extra height;
  and chess.jsx's board fit loop - which measures real overflow after paint and shrinks the board to
  clear it - absorbs the whole of it by trimming the board 375 -> 361.
  THE BOARD IS THE SHOCK ABSORBER, which is also why gate 12's `no scroll with the hint` assertion
  PASSES on the broken reading: the overflow is gone precisely because the board paid for it. That is
  CLAUDE.md's "is the thing I am trying to detect absorbed by the very mechanism I am asserting over?"
  in an eleventh costume, and it is why six runs of measuring the overflow found nothing.

  THE QUANTITY IS TEXT HEIGHT, NOT TEXT WIDTH, AND THAT CORRECTS SIX RUNS OF DIAGNOSIS. Overriding the
  app root's family and changing nothing else, at kunal 375x679 / se 375x568:
      Inter            (reference string 373.42px)   board 361 / 258    <- as-is, 2 FAIL
      Liberation Sans  (348.28px)                    board 375 / 260    <- 1 off at se
      DejaVu Sans      (402.12px)                    board 375 / 259    <- BOTH PINS EXACT
  DejaVu is WIDER than Inter and still correct, so the width cannot be the driver. #479-#484 measured
  the reference string's WIDTH (the 25.14px figure) and inferred from it; width is a proxy and it
  pointed at the wrong dimension. `pzStackH`, the obvious suspect and the term that feeds the board's
  heightCap at chess.jsx:3149, moved only 206 -> 205 -> 204 across the three faces and is NOT it.

  WHICH CLAUSE BELOW ACTUALLY DOES THE WORK, measured one clause at a time rather than asserted,
  because the first draft of this file got the mechanism backwards TWICE and a control caught it both
  times. Gate 12-hint on the same bundle, varying only the clause set:
      system-ui alone                      22 pass / 2 fail   board 361
      Segoe UI alone                       22 pass / 2 fail   board 361
      sans-serif alone                     24 pass / 0 fail   board 375 / 259
      Segoe UI + Roboto + sans-serif       24 pass / 0 fail
      all four (this file)                 24 pass / 0 fail
  SO THE LOAD-BEARING CLAUSE IS `sans-serif`, and the tell is indirect: binding it changes what
  `system-ui` resolves to (the log's system-ui reading moves 373.42 -> 402.12), because system-ui has
  no face of its own and lands on fontconfig's sans-serif alias. Binding `system-ui` directly does
  nothing in this Chromium.
  THE OTHER THREE ARE MEASURED INERT TODAY AND ARE KEPT DELIBERATELY, as a guard and not as decoration:
  if a later image installs a real Segoe UI or Roboto, the app's FIRST family would resolve for real,
  win over the generic chain, and move every text-derived pin again - and then those clauses are the
  ones that hold. Keeping them is cheap; discovering that absence costs a build slot.

  WHAT THIS DOES NOT CLAIM, stated so nobody reads more into it than was measured.
  (1) DejaVu Sans is NOT the font on Kunal's phone - iOS system-ui is SF Pro - so this makes the suite
      SELF-CONSISTENT and REPRODUCIBLE, not device-accurate. Every pin downstream of text metrics
      remains a statement about this harness rather than about his screen.
  (2) It does not close route (2) of
      jobs/the-suites-absolute-pixel-pins-are-container-dependent-so-this-container-cannot-gate-any-tree-2026-10-06
      - making those pins RELATIVE - which is test-authoring's and is the real repair.
  (3) NO ASSERTION IS WEAKENED AND NOTHING IS RE-PINNED. 375 and 259 are the numbers gate 12 has always
      demanded; re-pinning 375 to 361 is forbidden by that job and by three pen notes, and this run
      re-pinned nothing. This file changes the INSTRUMENT, not the expectation.
  (4) The fall-through sentinel still works: an unknown family is not in the match list below and still
      lands on Chromium's own default (322.15, Times), so lib.js's detector is unaffected.
-->
<fontconfig>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>

  <!-- THE ONE THAT DOES THE WORK TODAY. See the measurements above. -->
  <match target="pattern"><test name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>DejaVu Sans</string></edit></match>

  <!-- MEASURED INERT IN THIS CHROMIUM. Kept as the guard for an image that installs one of these
       faces for real, in which case the app's first family wins and these become load-bearing. -->
  <match target="pattern"><test name="family"><string>Segoe UI</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>DejaVu Sans</string></edit></match>
  <match target="pattern"><test name="family"><string>system-ui</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>DejaVu Sans</string></edit></match>
  <match target="pattern"><test name="family"><string>Roboto</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>DejaVu Sans</string></edit></match>
</fontconfig>
