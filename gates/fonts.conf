<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  gates/fonts.conf - PIN THE FONT FACE THE SUITE'S PINS WERE CALIBRATED AGAINST.
  Added #485. Turn it off for one run with CT_NOFC=1; an explicit FONTCONFIG_FILE always wins.
  gates/lib.js prints the resolved FACE in every gate log, so no log hides what it measured.

  !! NEVER WRITE A DOUBLE HYPHEN ANYWHERE IN THIS COMMENT. XML forbids it inside a comment, and
  fontconfig's failure mode is SILENT: it refuses the whole file and falls back to the system
  config, which is the Inter state this file exists to prevent. Measured while writing this file -
  a draft containing the CSS custom property 'var(' plus two hyphens plus 'head)' made fc-match
  answer Inter again with only a line-99 parse error on stderr that no gate reads. Validate any edit
  with xmllint in noout mode, then FONTCONFIG_FILE=$PWD/gates/fonts.conf fc-match sans-serif, and
  check the answer is DejaVu Sans rather than Inter.

  THIS COMMENT WAS REWRITTEN BEFORE THE PUSH, ON TWO ANTAGONIST VETOES THAT WERE BOTH UPHELD.
  Its first draft asserted four things that measurement contradicted. They are corrected below and
  the wrong versions are named, because this file is the thing the next six runs will read.

  == WHY IT EXISTS ==
  SEVEN consecutive build containers (#479-#484 and #485) could not gate ANY tree. gate 12-hint read
  the puzzle board 361 wide at kunal against a pinned 375, and 258 against 259 at se - 22 pass /
  2 fail, pixel-identical in all seven - and #479's full suite ended GATES RED with 115 FAIL across
  eleven sections. (THAT LAST FIGURE IS #479's, taken in ONE container, and no 479*.log exists in
  this repo, so it cannot be re-audited from this tree. Cite it as #479's record, not as a property
  of the class.) Two band-16 live defects a player hits were unshippable behind it.

  == THE CAUSE IS ONE FILE, AND IT IS NOT "INTER IS INSTALLED" ==
  /etc/fonts/conf.d/56-prefer-inter.conf. 1142 bytes, a REGULAR FILE among symlinks (every other
  entry in that directory points into /usr/share/fontconfig/conf.avail). It carries <alias><prefer>
  entries sending system-ui, ui-sans-serif, -apple-system, BlinkMacSystemFont, SF Pro Text,
  SF Pro Display, Segoe UI, Helvetica Neue AND sans-serif to Inter.
  The first draft said "this image carries 36 Inter faces, SO fontconfig answers the generic chain
  with Inter". WITHDRAWN: installing Inter does not do that. 60-latin.conf's sans-serif prefer list
  is Noto Sans, DejaVu Sans, Verdana, Arial, ... and Inter is not in it. The faces being installed is
  a necessary condition; this one config file is the cause.
  ITS mtime IS 2026-10-03 05:35 AND THAT IS NOT AN ARRIVAL DATE. An mtime dates an image LAYER, and
  it is EARLIER than #477's bundle stamp (#477 - 2026-10-04 03:34 ET), which gated GREEN at 56 suites
  / 4134 PASS. A green suite cannot have run with this file present, so the file's PRESENCE is proven
  and its ARRIVAL is inferred - from the pins going red, and from RUN-LOG.md:1883, where #483 relays
  a burst sandbox finding every pinned invariant-2 height exactly +1 on unmodified source on
  2026-10-03. Do not restate the mtime as a chronology.

  == THE QUANTITY IS TEXT HEIGHT, NOT TEXT WIDTH ==
  Overriding the app root's family and changing nothing else, at kunal 375x679 / 390 390x844 /
  se 320x568:
      Inter            (ref string 373.42px)   board 361 / 390 / 258    as-is, 2 FAIL
      Liberation Sans  (348.28px)               board 375 / 390 / 260    1 off at se
      DejaVu Sans      (402.12px)               board 375 / 390 / 259    all three pins exact
  DejaVu is WIDER than Inter and still correct, so width cannot be the driver. The 25.14px width
  figure #479-#484 reasoned from is a proxy and it pointed at the wrong dimension.
  THE TRANSMISSION PATH, and it is the fit loop and nothing else: at chess.jsx:3149 on the puzzle
  browse screen _edge is true and reserved==0, so widthCap==vw; heightCap = max(232, vh - safeTop
  - 8 - pzStackH - 62 - 26); board = min(widthCap, min(heightCap,820) - boardTrim). With the measured
  pzStackH of 206/205/204 heightCap is 377/378/379 - ALWAYS ABOVE widthCap 375 - so the analytic
  height term never binds and pzStackH is causally IRRELEVANT, not merely a weak suspect. Solving for
  the only remaining term gives boardTrim = 16 under Inter and <= 3 pinned. boardTrim is the fit
  loop's measured-overflow correction: it measures real overflow after paint and shrinks the board to
  clear it. THE BOARD IS THE SHOCK ABSORBER, which is why gate 12's own "no scroll with the hint"
  assertion PASSES on the broken reading - the overflow is gone because the board paid for it.
  boardTrim=16 is DERIVED from that arithmetic, never sampled. And WHICH ELEMENT GROWS IS UNKNOWN:
  pz-top and pz-bottom are flat across all three faces, so the extra height is in some sibling of
  the board that nothing measures.

  == THE "14px" IS A CLAMP DISTANCE, NOT A DELTA ==
  First draft: "the puzzle column accumulates about 14px of extra height". WITHDRAWN. 14 is the
  distance from Inter's board to the clamp, not to DejaVu's: under DejaVu the board is 375 == vw, so
  heightCap - trim >= 375 and the true Inter->DejaVu delta is >= 14 and UNBOUNDED ABOVE. The same
  accumulation shows as 1px at se (259 -> 258) and 0 at 390. Honest form: ">=14 at 375x679 (clamped),
  1 at 320x568, 0 at 390x844; the margin above the clamp is unmeasured."

  == AND THE CALIBRATION HAS ONE DISCRIMINATING LEG WITH NO HEADROOM ==
  Because reserved==0 on this screen, gate 12's kunal 375 and 390 390 pins ARE the viewport width:
  they are CLAMPS and pass for any face whose chrome is short enough - Liberation Sans passes both.
  se:259 at vw 320 is THE ONLY DISCRIMINATING NUMBER in the whole calibration, with a <0.6 tolerance
  and ZERO measured headroom. The first draft wrote that geometry as "se 375x568", which is
  short375's size (gates/lib.js:43), not se's 320x568 (gates/lib.js:34) - a misdirection on the one
  measurement a future reader must reproduce.

  == WHICH CLAUSE DOES THE WORK, AND WHY THE OTHER THREE CLAIM NOTHING ==
  Gate 12-hint, varying only the clause set: system-ui alone 22/2; Segoe UI alone 22/2;
  sans-serif alone 24/0; all four 24/0; wiring active with no env 24/0; CT_NOFC=1 22/2 reproducing
  361/258 exactly. So `sans-serif` is load-bearing. The tell is indirect: binding it moves the log's
  system-ui reading 373.42 -> 402.12, because system-ui has no face of its own.
  THE OTHER THREE ARE MEASURABLY REDUNDANT, NOT A GUARD. First draft called them "MEASURED INERT ...
  kept as the guard for an image that installs one of these faces for real, in which case the app's
  first family wins and these become load-bearing." WITHDRAWN TWICE OVER. (1) REDUNDANT: a config of
  <include> plus the sans-serif clause ALONE gives fc-match answers byte-identical to this four-clause
  file for Segoe UI, system-ui, Roboto, sans-serif and an unknown family - all DejaVuSans.ttf -
  because 49-sansserif.conf weakly append_lasts sans-serif onto every pattern naming neither serif nor
  monospace and <test name="family"> defaults to qual="any". That is also what moved the log's
  "Segoe UI" reading 373.42 -> 322.15, so "inert" was false as stated. (2) THE GUARD CANNOT WORK:
  Chromium DISCARDS fontconfig's substitution for a named non-generic family - fc-match answers DejaVu
  Sans for the Segoe UI pattern and Chromium renders Times (322.15) anyway - so a strong prepend on a
  named family can only make that family UNRESOLVABLE, never make Chromium use the pinned face for it.
  Whether anything here protects against an INSTALLED Segoe UI is UNMEASURED AND UNMEASURABLE in this
  image, because no such face exists. The clauses cost nothing and stay; this file claims nothing for
  them.

  == WHAT IS PINNED, AND WHAT IS NOT ==
  NOT the CSS `sans-serif` KEYWORD. First draft and HANDOFF said this file "binds the generic chain".
  WITHDRAWN: fc-match Arial is Liberation Sans with AND without this file, and Chromium's sans-serif
  keyword resolves through its own default (Arial) to Liberation Sans. What is pinned is the
  system-ui/unknown-family chain.
  SO THE SHIPPED INSTRUMENT IS TWO-FACED AND THE TABLE ABOVE IS A ONE-FACE EXPERIMENT. Live state:
  anything inheriting the app root (chess.jsx:5288, 'Segoe UI', system-ui, sans-serif) gets DejaVu Sans
  via system-ui; but the heading custom property (named "head", written with the usual two leading
  hyphens; declared at chess.jsx:5288, defined at chess.jsx:1396) is "'Baloo 2','Segoe UI',sans-serif"
  over 16 uses of it plus 9 headFont sites, and Baloo 2 comes from Google Fonts which gates/lib.js:23's BLOCK
  regex blocks BY DESIGN, and Segoe UI is now unresolvable - so every heading renders LIBERATION SANS.
  35 of the 92 fontFamily declarations are monospace (DejaVu Sans Mono) and the serif skins are DejaVu
  Serif. The table says "changing nothing else"; the running state is DejaVu root + Liberation
  headings, a combination nobody measured in isolation. It is NOT that se is wrong - gate 12 records se
  259/259 PASS under exactly this mixed state - it is that the table does not describe what runs.
  ALSO NOT PINNED, and it is the same class of variable this whole job is about: the <include> inherits
  the image's conf.d, which carries 10-hinting-slight, 12-unhinted-grayscale, 20-unhint-small-dejavu-sans,
  10-yes-antialias, 10-sub-pixel-rgb, 11-lcdfilter-default and 90-synthetic. Hinting and antialiasing
  change glyph advances, hence wrapping, hence column height. The DejaVu Sans VERSION also comes from
  the image. 56-prefer-inter.conf is itself the proof that this directory mutates between builds. With
  se at 259 against a 0.6 tolerance, the suite is one hinting flip or one DejaVu bump from this
  deadlock again.

  == DEJAVU IS A PIN, NOT A DERIVATION ==
  With 56-prefer-inter.conf absent the stock chain answers sans-serif, Segoe UI and system-ui with
  DejaVu Sans, so #475-#477's green containers were almost certainly on it and the choice is not a
  lucky 1-of-3 hit. BUT THAT DERIVATION IS ITSELF IMAGE-LOCAL: 60-latin.conf prefers "Noto Sans" BEFORE
  "DejaVu Sans", and this image installs ZERO Noto Sans faces (only Noto Color Emoji). Any later image
  that installs fonts-noto makes the stock answer Noto Sans and silently retires the justification
  while this file keeps pinning DejaVu. So treat DejaVu as a DELIBERATE PIN that happens to match
  today's stock answer, never as a derivation that will stay true. And no archived log can corroborate
  it: 113 logs in claude/agents/gatelogs and 0 record a toolchain or a face.

  == WHAT THIS DOES NOT CLAIM ==
  (1) DejaVu Sans is NOT the font on Kunal's phone (iOS system-ui is SF Pro). This makes the suite
      SELF-CONSISTENT and REPRODUCIBLE FROM #485 FORWARD, not device-accurate, and not continuous with
      its own 113-log history.
  (2) It does not close route (2) - making the pins RELATIVE - which is test-authoring's and is the
      real repair.
  (3) NO ASSERTION IS WEAKENED AND NOTHING IS RE-PINNED. 375, 390 and 259 are the numbers gate 12 has
      always demanded. Re-pinning 375 to 361 is forbidden and this run re-pinned nothing. This changes
      the INSTRUMENT, not the expectation.
  (4) The fall-through sentinel still reads 322.15 for an unknown family - but NOT for the reason the
      first draft gave ("an unknown family is not in the match list below"). WITHDRAWN: fc-match
      NoSuchFontXYZ returns DejaVu Sans under this file, so the unknown family IS in the match list via
      49-sansserif.conf. The sentinel survives only because of the same Chromium/Skia family-name check
      described above, which nobody here has measured. A wrong reason that reaches the right verdict is
      a trap, not a check.
  (5) NOTHING THAT DECIDES WHETHER THIS PROJECT MAY PUSH READS THE fontconfig LINE. grep over gates/*.sh
      for FONTCONFIG, CT_NOFC or fonts.conf returns nothing, so a log produced with CT_NOFC=1 still
      passes verify-log.sh. That is #450's shape recreated by this commit, it is deliberately NOT fixed
      here (one process job per run, and verify-log.sh is the push-authority tool, not a gate), and it
      is filed as
      jobs/no-push-authority-tool-can-see-which-fontconfig-produced-a-gate-log-2026-10-06.
-->
<fontconfig>
  <!-- ignore_missing="no", and BE PRECISE ABOUT WHAT THAT BUYS, because it is less than it looks.
       This file declares NO font directory and NO cache directory of its own; it inherits every one of
       them from the include below. MEASURED, both arms, with the include pointed at a missing path:
         ignore_missing="yes"  silent. fc-match returns EMPTY, fc-list returns 0 fonts, no diagnostic.
         ignore_missing="no"   LOUD on stderr ("Cannot load config file"), and then fontconfig refuses
                               this whole file and falls back to the system config: 103 fonts and
                               sans-serif resolving to Inter, which is the broken state this file exists
                               to prevent.
       So "no" converts a SILENT total font loss into a LOUD revert to Inter. Loud beats silent and that
       is why it is set, but it does NOT fail safe, and nothing in the harness reads stderr. THE THING
       THAT ACTUALLY CLOSES THIS HOLE IS gates/lib.js ASSERTING THE RESOLVED FACE and printing it, which
       catches both arms regardless of this attribute. Do not read this attribute as the guard. -->
  <include ignore_missing="no">/etc/fonts/fonts.conf</include>

  <!-- THE ONE THAT DOES THE WORK. See the clause-by-clause measurements above. -->
  <match target="pattern"><test name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>DejaVu Sans</string></edit></match>

  <!-- REDUNDANT WITH THE CLAUSE ABOVE, measured byte-identical at the fontconfig layer. Kept because
       they cost nothing and make the intent explicit. They are NOT a guard: see "THE GUARD CANNOT
       WORK" above. This file claims no protection for them. -->
  <match target="pattern"><test name="family"><string>Segoe UI</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>DejaVu Sans</string></edit></match>
  <match target="pattern"><test name="family"><string>system-ui</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>DejaVu Sans</string></edit></match>
  <match target="pattern"><test name="family"><string>Roboto</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>DejaVu Sans</string></edit></match>
</fontconfig>
