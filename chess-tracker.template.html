<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chess Trainer — task tracker</title>
<style>
:root{--bg:#14171c;--card:#1c2027;--line:rgba(255,255,255,.08);--tx:#e8eaee;--dim:rgba(255,255,255,.58);--r:12px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:18px 14px 60px}
h1{font-size:20px;margin:0 0 2px}
.stamp{color:var(--dim);font-size:12.5px;margin-bottom:14px}
.tot{color:var(--dim);font-size:12.5px;margin:0 0 14px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--tx);border-radius:18px;padding:7px 14px;font-size:13px;cursor:pointer}
.chip.on{background:#2c5f8a;border-color:#2c5f8a}
.grp{margin-bottom:20px}
.gh{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;margin:0 0 8px;letter-spacing:.02em}
.gdot{width:10px;height:10px;border-radius:50%}
.gnew{font-size:10px;background:#e0b85a;color:#1a1a1a;border-radius:8px;padding:1px 7px;font-weight:700}
.task{background:var(--card);border:1px solid var(--line);border-left-width:3px;border-radius:var(--r);padding:10px 12px;margin-bottom:8px}
.trow{display:flex;align-items:flex-start;gap:8px}
.tt{flex:1;font-size:14px;font-weight:550}
.pill{font-size:10.5px;border-radius:8px;padding:2px 8px;font-weight:700;white-space:nowrap;margin-top:1px}
.p-open{background:rgba(123,209,255,.16);color:#7bd1ff}
.p-part{background:rgba(224,184,90,.16);color:#e0b85a}
.p-done{background:rgba(74,103,65,.5);color:#9fd28f}
.you{font-size:10.5px;border-radius:8px;padding:2px 8px;font-weight:700;background:rgba(224,90,90,.18);color:#f0a0a0;margin-top:1px;white-space:nowrap}
.bb{font-size:10.5px;color:var(--dim);margin-top:1px;white-space:nowrap}
.nn{color:var(--dim);font-size:12.5px;margin-top:5px}
.hide{display:none}
</style>
</head>
<body>
<h1>Chess Trainer — task tracker</h1>
<div class="stamp">__STAMP__</div>
<div class="tot" id="tot"></div>
<div class="chips" id="chips"></div>
<div id="root"></div>
<script>
const GROUPS = __GROUPS_JSON__;
const TASKS = __TASKS_JSON__;
let filt = "all";
const FILTS = [["all","All"],["open","Open"],["part","In progress"],["you","Needs you"],["done","Done"]];
function pill(s){return s==="open"?'<span class="pill p-open">OPEN</span>':s==="part"?'<span class="pill p-part">IN PROGRESS</span>':'<span class="pill p-done">DONE</span>';}
function pass(t){if(filt==="all")return true;if(filt==="you")return !!t.you&&t.s!=="done";return t.s===filt;}
function esc(x){return String(x||"").replace(/&/g,"&amp;").replace(/</g,"&lt;");}
function render(){
  const root=document.getElementById("root");root.innerHTML="";
  let shown=0;
  for(const g of GROUPS){
    const ts=TASKS.filter(t=>t.g===g.key&&pass(t));
    if(!ts.length)continue;shown+=ts.length;
    const d=document.createElement("div");d.className="grp";
    d.innerHTML='<div class="gh"><span class="gdot" style="background:'+g.color+'"></span>'+esc(g.nm)+(g.isNew?' <span class="gnew">NEW</span>':'')+'</div>'+
      ts.map(t=>'<div class="task" style="border-left-color:'+g.color+'"><div class="trow"><div class="tt">'+esc(t.t)+'</div>'+pill(t.s)+(t.you&&t.s!=="done"?'<span class="you">NEEDS YOU</span>':'')+(t.b?'<span class="bb">'+esc(t.b)+'</span>':'')+'</div>'+(t.n?'<div class="nn">'+esc(t.n)+'</div>':'')+'</div>').join("");
    root.appendChild(d);
  }
  const o=TASKS.filter(t=>t.s==="open").length,p=TASKS.filter(t=>t.s==="part").length,dn=TASKS.filter(t=>t.s==="done").length,y=TASKS.filter(t=>t.you&&t.s!=="done").length;
  document.getElementById("tot").textContent=TASKS.length+" tasks · "+o+" open · "+p+" in progress · "+dn+" done · "+y+" need you"+(filt!=="all"?" · showing "+shown:"");
}
function chips(){
  const c=document.getElementById("chips");c.innerHTML="";
  for(const[k,nm]of FILTS){
    const b=document.createElement("button");b.className="chip"+(filt===k?" on":"");b.textContent=nm;
    b.onclick=()=>{filt=k;chips();render();};c.appendChild(b);
  }
}
chips();render();
</script>
</body>
</html>
