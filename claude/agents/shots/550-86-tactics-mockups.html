<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box}body{margin:0;background:#000;font-family:"Segoe UI",system-ui,sans-serif;color:#fff}
.ph{width:375px;height:761px;position:relative;overflow:hidden;background:radial-gradient(#22262e,#16181d)}
.hdr{height:40px;display:flex;align-items:center;justify-content:space-between;padding:0 8px;color:#6fa8ff;letter-spacing:2px;font-size:19px;font-family:Georgia,serif}
.menu{width:36px;height:30px;border:1px solid #555;border-radius:8px;color:#ddd;display:flex;align-items:center;justify-content:center;font-size:16px}
.row{display:flex;gap:8px;align-items:center;padding:0 6px}
.back{height:40px;padding:0 12px;border:1px solid rgba(255,255,255,.25);border-radius:12px;display:flex;align-items:center;font-size:14px;color:#ddd;flex:none}
.seg{flex:1;display:flex;height:40px;border:1px solid rgba(255,255,255,.2);border-radius:12px;overflow:hidden}
.seg div{flex:1;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px}
.seg .on{background:#2f6f96;color:#fff}.seg .off{color:#ccc}
.card{margin:0 6px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.05);border-radius:12px;padding:7px 11px;font-size:15px;line-height:1.3}
.card .t{display:flex;justify-content:space-between;font-weight:800;font-size:15px;margin-bottom:2px}.card .t span{color:#9fc7ff;font-size:13px}
.board{width:375px;height:375px;display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);position:relative}
.board div{display:flex;align-items:center;justify-content:center;font-size:36px;line-height:1}
.l{background:#dfe8f1}.d{background:#5b86ab}
.btns{display:flex;gap:8px;padding:0 6px}.bt{flex:1;height:44px;border-radius:11px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px}
.tip{text-align:center;color:rgba(255,255,255,.6);font-size:13px}
.tab{position:absolute;left:0;right:0;bottom:0;height:55px;background:#15171c;border-top:1px solid rgba(255,255,255,.08);display:flex;justify-content:space-around;align-items:center;font-size:11px;color:#aaa}
.tab b{color:#6fa8ff;font-weight:700}
.red{position:absolute;border:3px solid #ff2020;pointer-events:none}
.lab{position:absolute;bottom:62px;left:8px;background:#ff2020;color:#fff;font-weight:800;font-size:11px;padding:2px 7px;border-radius:5px;z-index:5}
</style></head><body>
<div id="A" class="ph"></div><div id="B" class="ph"></div>
<script>
const FEN='6k1/3q1p1p/8/8/4N3/8/6K1/8';const G={k:'♚',q:'♛',r:'♜',b:'♝',n:'♞',p:'♟'};
function board(){const el=document.createElement('div');el.className='board';FEN.split('/').forEach((r,ri)=>{let c=0;for(const ch of r){if(/\d/.test(ch)){for(let i=0;i<+ch;i++)sq(ri,c++,null);}else sq(ri,c++,ch);}});
 function sq(ri,ci,ch){const d=document.createElement('div');d.className=(ri+ci)%2?'d':'l';if(ch){d.textContent=G[ch.toLowerCase()];d.style.color=ch===ch.toUpperCase()?'#fff':'#111';if(ch===ch.toUpperCase())d.style.textShadow='0 0 2px #000,0 0 1px #000';}el.appendChild(d);}return el;}
const hdr='<div class="hdr"><span>♛ CHESS TRAINER</span><span class="menu">☰</span></div>';
const topRow='<div class="row" style="margin-top:4px"><div class="back">‹ Back</div><div class="seg"><div class="on">Tactics</div><div class="off">Strategy</div></div></div>';
const prompt='<div class="card"><div class="t">Fork <span>Easy · 1/13</span></div>White to play. One knight move hits two things at once.</div>';
const btns='<div class="btns"><div class="bt">💡 Hint</div><div class="bt">Show answer</div></div>';
const tab='<div class="tab"><span>⌂<br>Home</span><span><b>◎<br>Discover</b></span><span>🧩<br>Puzzles</span><span>🔍<br>Review</span><span>♟<br>Play</span></div>';
function build(id,order,label){const p=document.getElementById(id);p.innerHTML=hdr+topRow;const col=document.createElement('div');col.style.cssText='display:flex;flex-direction:column;gap:6px;margin-top:6px';
 for(const o of order){if(o==='board')col.appendChild(board());else{const w=document.createElement('div');w.innerHTML=o;col.appendChild(w.firstElementChild||w);}}
 p.appendChild(col);p.insertAdjacentHTML('beforeend',tab+'<div class="lab">'+label+'</div>');
 const b=p.querySelector('.board').getBoundingClientRect(),q=p.getBoundingClientRect();const r=document.createElement('div');r.className='red';r.style.cssText+=`left:${b.left-q.left}px;top:${b.top-q.top-2}px;width:${b.width}px;height:${b.height+4}px`;p.appendChild(r);
 const last=[...col.children].pop().getBoundingClientRect();return {boardTop:b.top-q.top,boardW:b.width,lastBottom:last.bottom-q.top,tabTop:706};}
window.M={A:build('A',[prompt,'board','<div class="tip">Tap the piece to move.</div>',btns],'OPTION A'),B:build('B',['board',prompt,btns],'OPTION B')};
</script></body></html>
